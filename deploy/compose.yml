# NewsGenerator on the machine that stays on: the database, the API with its background work (the
# ingestion) and RSS-Bridge. Sent and started by deploy/deploy.sh, from ~/newsgenerator/server.
# The embedder runs apart (embedder/Dockerfile), as the graphics card of another machine does: the
# API asks every address of EMBEDDER_URL that answers at the same time.
#
# Next to the code, never sent with it (one variable per line, readable by their owner only):
#   ~/newsgenerator/db.env    POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   ~/newsgenerator/api.env   the .env of the server, DATABASE_URL to db:5432 and RSS_BRIDGE_URL to
#                             http://rss-bridge
#   ~/newsgenerator/tunnel.env  TUNNEL_TOKEN of the tunnel of Cloudflare (optional: without it the
#                             site is served on the local network only, see deploy.sh)
#   ~/newsgenerator/web.env   SITE_USER and SITE_PASSWORD_HASH, the password asked by the browser
#                             before the site (Caddyfile); the hash given by `caddy hash-password`,
#                             between single quotes (its "$" are not variables)
# Docker refuses a file it cannot read as the user running it: they belong to that user.
#
# Only the database, the API and the site listen on the network, on the address of the machine
# (HOST_IP): the site and the API for the local network, the database for the server run by hand on
# another machine while coding. The internet reaches the site through the tunnel only.

name: newsgenerator

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: newsgenerator-db
    restart: unless-stopped
    env_file: ../../db.env
    # Postgres keeps 128 MB in memory by default: the 48 h window of the news read by the grouping
    # (about 300 MB with their vectors) and the stories (110 MB) were read again at each news
    command: postgres -c shared_buffers=2GB -c effective_cache_size=6GB -c work_mem=32MB -c maintenance_work_mem=512MB
    shm_size: 1g
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "${HOST_IP:-192.168.1.135}:5433:5432"

  api:
    build: ..
    container_name: newsgenerator-api
    restart: unless-stopped
    env_file: ../../api.env
    depends_on:
      - db
      - rss-bridge
    ports:
      - "${HOST_IP:-192.168.1.135}:3001:3001"

  # the page and its API on one address (Caddyfile), the client built by deploy.sh
  web:
    image: caddy:2.11-alpine
    container_name: newsgenerator-web
    restart: unless-stopped
    depends_on:
      - api
    env_file: ../../web.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../client-dist:/srv:ro
      - web-data:/data
    ports:
      - "${HOST_IP:-192.168.1.135}:8080:80"

  # news.fabianrostello.com -> http://web:80, set in the tunnel on the dashboard of Cloudflare.
  # Started only with ~/newsgenerator/tunnel.env (the profile "tunnel", see deploy.sh)
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    container_name: newsgenerator-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file: ../../tunnel.env
    depends_on:
      - web

  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: newsgenerator-rss-bridge
    restart: unless-stopped
    # reached by the API only, at http://rss-bridge (see docker-compose.yml)
    volumes:
      - ../docker/rss-bridge:/config:ro

volumes:
  db:
  web-data:
